# 每次 push / PR 都跑一遍本仓**自己的判据** —— 不是「能编译就算过」。
#
# 五个 job 对应五类判据，每一类都能单独变红：
#   rust            编译期与运行期：fmt / clippy -D warnings / 全部测试
#                   （含 crates/reality —— REALITY 的等价实现；它的真栈判据需要
#                    stock Xray 二进制，缺失时该测试如实失败 —— 见 d 该测试文件头，
#                    CI 里不装 Xray，所以那三条在 CI 上标 #[ignore] 由本地跑）
#   gates           事实系统：五道闸门 + 自证 + 文档里的机器块与台账一致
#   patch-repro     补丁可重现：打到**原始** rustls 上应得到与 vendored 目录逐文件相同的树
#   ech-offline     ECH 的离线判据：内层与 uTLS 逐字节相同 + uTLS 自家服务端接受我们的提议
#   upstream        原版套件：跑 refraction-networking/utls 自己的测试（不联网那两条 `-skip`）
#   upstream-no-skip 原版套件**全量**：一条都不跳，见文件末尾那个 job 的说明
#
# 不在 CI 里跑的，以及为什么（别把这几条当成「忘了」）：
#   * 联网判据（`end_to_end` / `ech_e2e`）：要打 browserleaks / Cloudflare / defo.ie 的 443。
#     它们在本地用 `cargo test -- --ignored` 跑，判据本身仍在仓库里。
#   * 基准 `plan-cost`：只是打数字给人看，不做门禁（换机器数值就变）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust（fmt / clippy / 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      # --all-features：`json` feature（上游 ClientHelloSpec 的 JSON 格式）默认关，
      # 它的判据（utls_json_golden）挂着 required-features —— 不开就是**安静地少跑一个目标**。
      - name: cargo clippy（-D warnings，全 feature）
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace（全 feature）
        run: cargo test --workspace --all-features
      - name: 速度与 CPU（只看数字，不做门禁）
        run: |
          cargo build --release --example plan-cost
          ./target/release/examples/plan-cost

  gates:
    name: 事实系统的五道闸门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 五道闸门
        run: |
          for g in zreflect/check_*.py; do echo "--- $g"; python3 "$g"; done
        env:
          # 复跑命令闸门会真跑台账里每条 cmd。`rustc --version` / `cargo --version`
          # 记的是**本机**的值，换台机器必然不同 —— 所以这里**显式点名**跳过这两条，
          # 闸门会把它跳过了哪些打印出来（静默跳过会被当成通过）。
          REFLECT_CMDS_SKIP: rustc_version,cargo_version
      - name: 闸门自证（每个闸门都必须能红）
        run: sh gates-selftest.sh
      - name: 文档里的机器块与台账一致
        run: python3 zreflect/facts.py --check STATE.md

  patch-repro:
    name: 补丁可重现
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: patch.diff 打到原始 rustls 上，必须重现 crates/rustls（两条判据）
        # 脚本是本仓唯一的实现：本地 `sh crates/rustls-fork/verify-patch.sh` 与之同源，
        # 不会出现「两个判据都叫补丁可重现」。口径是**整棵 crate**（排除 .git/target）。
        run: sh crates/rustls-fork/verify-patch.sh "$RUNNER_TEMP/rs-verify"

  ech-offline:
    name: ECH 离线判据（逐字节 + uTLS 自家服务端）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: 取 uTLS 源码树（探针要在这棵树上跑）
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          # --strip-components=1：codeload 给的顶层目录名随 ref 而变
          # （分支 ref 是 `utls-master/`，tag 是 `utls-1.8.2/`），写死 mv 会踩空。
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1
      - name: 内层与 uTLS 逐字节相同
        run: cargo test -p utls-engine --test ech_inner_utls -- --nocapture
      - name: 我们的客户端 vs uTLS 自己的 ECH 服务端（真握手）
        run: cargo test -p utls-engine --test ech_utls_server -- --ignored --nocapture
        env:
          UTLS_REF_DIR: /tmp/utls-ref/utls-master

  upstream:
    name: 原版 uTLS 套件
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: 取原版源码并跑它自己的测试
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          # --strip-components=1：codeload 给的顶层目录名随 ref 而变
          # （分支 ref 是 `utls-master/`，tag 是 `utls-1.8.2/`），写死 mv 会踩空。
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1
          cd /tmp/utls-ref/utls-master   # 绝对路径：上面没再 cd 过，相对路径会落到 checkout 目录
          # 那两条要 www.google.com / yahoo.com 的 egress（见文件头说明），这里跳过；
          # 除它们之外**一条都不跳**，唯一被 skip 的是上游自己 t.Skip 的那条。
          go test -count=1 -timeout 480s -json \
            -skip 'TestVerifyHostname|TestRealResumption' ./... > /tmp/upstream.json
          # 与 `upstream-no-skip` 那个 job 同一套断言：**跳过集恰如预期**、
          # **顶层 PASS 数非零**、**那两条 egress 测试确实没被跑**。
          # 少了这些，一次「什么都没跑」或「-skip 没生效」的解析会安静地绿。
          # ⚠️ `-skip` 是**把测试从运行里摘掉**，不是让它报 skip —— 所以那两条
          # 既不在 pass 里、也不在 skip 里（实测：跳过集只有上游自己 t.Skip 的那条）。
          python3 - <<'PY'
          import json, sys
          upstream_self_skip = 'TestUTLSHandshakeClientParrotGolang'   # 上游自己 t.Skip
          excluded = {'TestVerifyHostname', 'TestRealResumption'}      # 本 job 显式 -skip
          top_pass, skips = set(), set()
          for line in open('/tmp/upstream.json'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  ev = json.loads(line)
              except json.JSONDecodeError:
                  continue
              t, a = ev.get('Test'), ev.get('Action')
              if not t:
                  continue
              if '/' in t:
                  continue
              if a == 'pass':
                  top_pass.add(t)
              elif a == 'skip':
                  skips.add(t)
          print(f"原版套件（-skip 两条 egress）：顶层 {len(top_pass)} PASS，跳过 {sorted(skips)}")
          if not top_pass:
              sys.exit("⚠️ 顶层 PASS 数为 0 —— 这一跑什么都没验到（不是「通过」）")
          if skips != {upstream_self_skip}:
              sys.exit(f"⚠️ 跳过集与预期不符：{sorted(skips)} != ['{upstream_self_skip}']")
          ran = excluded & top_pass
          if ran:
              sys.exit(f"⚠️ 这两条本该被 -skip 摘掉，却出现在 PASS 里：{sorted(ran)}")
          PY

  # 与上面那个 job 互补 —— 两个都别删，它们判的不是同一件事：
  #   * `upstream`         ：**未改一字节**的上游树，代价是把那两条外网测试 `-skip` 掉
  #                          ⇒ 「上游那棵树自己没问题」的基线。
  #   * `upstream-no-skip` ：**一条都不跳**，代价是那两条的目标域名由 `-overlay` 在
  #                          **构建期**换成国内直连可达、且判据等价的 `www.baidu.com`
  #                          （上游树在磁盘上仍是一字节没动）
  #                          ⇒ 「全量无跳过」这句话在无代理环境下也成立。
  upstream-no-skip:
    name: 原版套件（无代理 · 不 -skip）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: 取原版源码
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          # --strip-components=1：同上，codeload 的顶层目录名随 ref 而变。
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1
      - name: 跑全量（不 -skip；上游树靠 go -overlay 在构建期替换，磁盘不动）
        env:
          # runner 的 module cache 是冷的（脚本默认 `GOPROXY=off`，本地用它证明不联网取模块）。
          GOPROXY: https://proxy.golang.org,direct
        run: sh crates/utls/tests/fixtures/gen-reference/run-upstream-suite.sh /tmp/utls-ref/utls-master
