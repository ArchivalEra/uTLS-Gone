# 每次 push / PR 都跑一遍本仓**自己的判据** —— 不是「能编译就算过」。
#
# 五个 job 对应五类判据，每一类都能单独变红：
#   rust        编译期与运行期：fmt / clippy -D warnings / 全部测试
#   gates       事实系统：五道闸门 + 自证 + 文档里的机器块与台账一致
#   patch-repro 补丁可重现：打到**原始** rustls 上应得到与 vendored 目录逐文件相同的树
#   ech-offline ECH 的离线判据：内层与 uTLS 逐字节相同 + uTLS 自家服务端接受我们的提议
#   upstream    原版套件：跑 refraction-networking/utls 自己的测试
#
# 不在 CI 里跑的，以及为什么（别把这几条当成「忘了」）：
#   * 联网判据（`end_to_end` / `ech_e2e`）：要打 browserleaks / Cloudflare / defo.ie 的 443。
#     它们在本地用 `cargo test -- --ignored` 跑，判据本身仍在仓库里。
#   * 原版那两条要真外网的测试：本机是**经一个 SOCKS5h 代理 + /etc/hosts** 才通的
#     （配方见 questions/09）；GitHub runner 上跑不了那套转发，所以这里显式 `-skip`。
#   * 基准 `plan-cost`：只是打数字给人看，不做门禁（换机器数值就变）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust（fmt / clippy / 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: 速度与 CPU（只看数字，不做门禁）
        run: |
          cargo build --release --example plan-cost
          ./target/release/examples/plan-cost

  gates:
    name: 事实系统的五道闸门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 五道闸门
        run: |
          for g in zreflect/check_*.py; do echo "--- $g"; python3 "$g"; done
        env:
          # 复跑命令闸门会真跑台账里每条 cmd。`rustc --version` / `cargo --version`
          # 记的是**本机**的值，换台机器必然不同 —— 所以这里**显式点名**跳过这两条，
          # 闸门会把它跳过了哪些打印出来（静默跳过会被当成通过）。
          REFLECT_CMDS_SKIP: rustc_version,cargo_version
      - name: 闸门自证（每个闸门都必须能红）
        run: sh gates-selftest.sh
      - name: 文档里的机器块与台账一致
        run: python3 zreflect/facts.py --check STATE.md

  patch-repro:
    name: 补丁可重现
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 把 patch.diff 打到原始 rustls 0.23.45 上，与 vendored 目录逐文件比
        run: |
          set -eu
          w=$(mktemp -d) && cd "$w"
          curl -sSLO https://static.crates.io/crates/rustls/rustls-0.23.45.crate
          tar xzf rustls-0.23.45.crate && cd rustls-0.23.45
          git init -q . && git add -A && git -c user.email=x@y -c user.name=x commit -qm pristine
          git apply "$GITHUB_WORKSPACE/crates/rustls-fork/patch.diff"
          # 判据一：文件数 == 带 FORK(utls-rs) 标记的文件数
          files=$(grep -c '^diff --git' "$GITHUB_WORKSPACE/crates/rustls-fork/patch.diff")
          marked=$(grep -rl 'FORK(utls-rs)' "$GITHUB_WORKSPACE/crates/rustls/src" --include='*.rs' | wc -l)
          echo "补丁文件数=$files  带标记的文件数=$marked"
          [ "$files" = "$marked" ]
          # 判据二：打出来能**重现**我们的树
          diff -r src "$GITHUB_WORKSPACE/crates/rustls/src"
          echo "OK：补丁打到原始树上与 vendored 树逐文件相同"

  ech-offline:
    name: ECH 离线判据（逐字节 + uTLS 自家服务端）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: 取 uTLS 源码树（探针要在这棵树上跑）
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          # --strip-components=1：codeload 给的顶层目录名随 ref 而变
          # （分支 ref 是 `utls-master/`，tag 是 `utls-1.8.2/`），写死 mv 会踩空。
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1
      - name: 内层与 uTLS 逐字节相同
        run: cargo test -p utls-engine --test ech_inner_utls -- --nocapture
      - name: 我们的客户端 vs uTLS 自己的 ECH 服务端（真握手）
        run: cargo test -p utls-engine --test ech_utls_server -- --ignored --nocapture
        env:
          UTLS_REF_DIR: /tmp/utls-ref/utls-master

  upstream:
    name: 原版 uTLS 套件
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: 取原版源码并跑它自己的测试
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          # --strip-components=1：codeload 给的顶层目录名随 ref 而变
          # （分支 ref 是 `utls-master/`，tag 是 `utls-1.8.2/`），写死 mv 会踩空。
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1
          cd /tmp/utls-ref/utls-master   # 绝对路径：上面没再 cd 过，相对路径会落到 checkout 目录
          # 那两条要 www.google.com / yahoo.com 的 egress（见文件头说明），这里跳过；
          # 除它们之外**一条都不跳**，唯一被 skip 的是上游自己 t.Skip 的那条。
          go test -count=1 -timeout 480s \
            -skip 'TestVerifyHostname|TestRealResumption' ./...
