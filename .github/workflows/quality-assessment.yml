# 本地版「代码质量评估」——GitHub Code Quality 官方版在个人账号上
# 不可用（Team/Enterprise + 独立付费），这里用**本仓已有的判据**做等价替代：
# 不新增 lint 规则，只把 ci.yml 六个 job 的检查逐条跑一遍，产出
# 可比的 PR/周报摘要（GITHUB_STEP_SUMMARY）+ 可下载的日志 artifact。
# 失败如实记 rc，不伪装、不吞错。
#
# 与 ci.yml 的分工：ci.yml 是门禁（红 = 不许进 main）；
# 本 workflow 是评估报表（同命令、同判据，只做呈现与留档）。

name: Code quality assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assess:
    name: Assess ${{ github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take uTLS reference tree (for the two upstream suite checks)
        run: |
          set -eu
          mkdir -p /tmp/utls-ref/utls-master
          curl -sSL -o /tmp/master.tar.gz \
            https://codeload.github.com/refraction-networking/utls/tar.gz/refs/heads/master
          tar xzf /tmp/master.tar.gz -C /tmp/utls-ref/utls-master --strip-components=1

      - name: Take stock Xray-core (for the REALITY stack check)
        run: |
          set -eu
          mkdir -p /tmp/xray-bin
          curl -sSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q /tmp/xray.zip -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          /tmp/xray-bin/xray version

      # ci.yml 的 upstream job 在 go test 后有一段内联 python 断言
      #（顶层 PASS 非零 / 跳过集恰如预期 / -skip 的两条确实没跑）。
      # 这里把同一段断言存成脚本，让下面的 `upstream` 检查项与门禁同源可复跑。
      # （脚本以 base64 内嵌：YAML 块标量里写 heredoc 结束符有缩进陷阱。）
      - name: Prepare upstream assertion script
        run: |
          echo '' | base64 -d > "$RUNNER_TEMP/upstream_assert.py"

      - name: Run checks
        id: checks
        shell: bash
        run: |
          set +e
          # shellcheck 0.11.0（静态二进制，取官方 release）：对本仓两个 POSIX sh 脚本
          # 做外部验证。两个脚本在 0.11.0 `-s sh` 下实测 0 finding，这里**零豁免**
          # —— 不是新 lint 规则，是对既有壳的第三方检查，未来壳的变更若引入
          # finding，结果会如实红。
          curl -sSL --retry 3 --retry-delay 2 -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar xf /tmp/shellcheck.tar.xz -C /tmp
          SHELLCHECK=/tmp/shellcheck-v0.11.0/shellcheck
          "$SHELLCHECK" --version | head -2
          "$SHELLCHECK" -s sh crates/rustls-fork/verify-patch.sh crates/utls/tests/fixtures/gen-reference/run-upstream-suite.sh \
            | tee /tmp/shellcheck-findings.txt
          # shellcheck 无 finding 时输出为空且 rc=0；有 finding 时 rc=1（print 到 stderr，
          # 用 tee 落盘留档）。
          printf 'shellcheck\tshellcheck -s sh <两个 POSIX sh 脚本>\t' >> results.tsv
          if [ -s /tmp/shellcheck-findings.txt ]; then
            printf '1\n' >> results.tsv
            echo '  shellcheck: rc=1 (findings above)'
          else
            printf '0\n' >> results.tsv
            echo '  shellcheck: rc=0 (0 findings)'
          fi
          # 顺序不是随意的：这些检查在**同一个 runner 的同一棵参照树**上顺序执行，
          # 而 ci.yml 的 ech-offline 与 upstream 是**各自独立 runner**——前者把
          # ech_server_live_test.go 复制进参照树后，污染只留在它自己的 checkout 里；
          # 这里若把 upstream 排在 ech-server 之后，探针的自跳过会撞上
          # 「跳过集恰如预期」断言（首轮实测 rc=1 正是这么来的）。
          # 所以：upstream 最先跑；ech-server 之后立刻把探针删掉；
          # upstream-no-skip 的脚本本就按文件名自清探针，放在最后。
          declare -a names=(upstream cargo-fmt clippy tests patch-repro ech-inner ech-server cleanup-ref-tree upstream-no-skip reality-stack)
          declare -a cmds=(
            'cd /tmp/utls-ref/utls-master && go test -count=1 -timeout 480s -json -skip "TestVerifyHostname|TestRealResumption" ./... > /tmp/upstream.json && python3 "$RUNNER_TEMP/upstream_assert.py"'
            'cargo fmt --all --check'
            'cargo clippy --workspace --all-targets --all-features -- -D warnings'
            'cargo test --workspace --all-features'
            'sh crates/rustls-fork/verify-patch.sh "$RUNNER_TEMP/rs-verify"'
            'cargo test -p utls-engine --test ech_inner_utls -- --nocapture'
            'cargo test -p utls-engine --test ech_utls_server -- --ignored --nocapture'
            'rm -f /tmp/utls-ref/utls-master/ech_server_live_test.go'
            'GOPROXY=https://proxy.golang.org,direct sh crates/utls/tests/fixtures/gen-reference/run-upstream-suite.sh /tmp/utls-ref/utls-master'
            'cargo test -p reality --test real_stack -- --include-ignored --nocapture'
          )
          : > results.tsv
          for i in "${!names[@]}"; do
            n="${names[$i]}"; c="${cmds[$i]}"
            printf '%s\t%s\t' "$n" "$c" >> results.tsv
            bash -c "$c" > "/tmp/$n.log" 2>&1
            rc=$?
            printf '%s\n' "$rc" >> results.tsv
            printf '  %s: rc=%s\n' "$n" "$rc"
          done

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Code quality assessment — uTLS-Gone"
            echo ""
            echo "| Check | Command | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.tsv ]; then
            while IFS=$'\t' read -r n c rc; do
              badge=$([ "$rc" = "0" ] && echo PASS || echo "FAIL (rc=$rc)")
              printf '| %s | `%s` | %s |\n' "$n" "$c" "$badge" >> "$GITHUB_STEP_SUMMARY"
            done < results.tsv
          else
            echo "| (no results) | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "Assessment uses each repository's existing gates (no new lint rules)."
            echo "GitRoll context: findings are triaged as own / external bytes / false positive; see trash-can@gitroll/2026-11-12/_round3-internal-accounting.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: /tmp/*.log
          if-no-files-found: ignore
