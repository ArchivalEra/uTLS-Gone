[package]
name = "reality"
description = "XTLS/REALITY 的 Rust 等价实现：鉴权 / 密钥派生 / 镜像与 fallback（权威参照 XTLS/REALITY）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
x25519-dalek.workspace = true
x25519-os = { path = "../x25519-os" }
aes-gcm.workspace = true
sha2.workspace = true
# 记录层 AEAD 的第三种套件（ChaCha20-Poly1305）
chacha20poly1305 = "0.10"
# HMAC-SHA512：镜像证书尾签（handshake_server_tls13.go:149）
hmac = "0.12"
hkdf.workspace = true
# 服务端半边的 TLS 1.3 握手（rustls 的 ResolvesServerCert 正好承载 REALITY 的
# 每连接证书尾签）。依赖走 workspace 的 [patch.crates-io] ⇒ 同一份 vendored fork。
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "logging"] }

[dev-dependencies]
utls = { path = "../utls" }
serde_json = "1"
# P-256 真公钥（真站要拿它做 ECDH；哑字节会被 rustls 拒绝）
p256 = "0.13"
# Xray 的 publicKey 是 base64url（raw）
base64 = "0.22"
x25519-dalek.workspace = true
