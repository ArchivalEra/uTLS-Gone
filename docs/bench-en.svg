<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" role="img" aria-label="Marginal CPU per hello: uTLS-Gone 13.3 µs vs uTLS (Go) 102 µs, 7.7x; 9.7 KB allocated per hello vs 20.8 KB; RSS parity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <linearGradient id="gGo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57606a"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
    <linearGradient id="gRs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f37"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3fb950" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="878" height="484" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="46" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">Marginal CPU per hello</text>
  <text x="24" y="70" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">same layer · same 39 presets · both default builds</text>

  <text x="840" y="66" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#56d364" filter="url(#glow)">7.7×</text>
  <text x="840" y="88" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">vs upstream uTLS</text>

  <text x="24" y="122" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">39-preset intersection · per hello</text>

  <text x="188" y="158" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">uTLS (Go 1.27)</text>
  <rect x="200" y="140" width="560" height="26" rx="5" fill="url(#gGo)"/>
  <text x="768" y="158" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">102 µs</text>

  <text x="188" y="198" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">uTLS-Gone</text>
  <rect x="200" y="180" width="73" height="26" rx="5" fill="url(#gRs)"/>
  <text x="281" y="198" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">13.3 µs</text>
  <text x="356" y="198" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#56d364">7.7×</text>

  <text x="24" y="248" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">single preset Chrome(70)</text>

  <text x="188" y="284" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">uTLS (Go 1.27)</text>
  <rect x="200" y="266" width="412" height="26" rx="5" fill="url(#gGo)"/>
  <text x="620" y="284" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">75 µs</text>

  <text x="188" y="324" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">uTLS-Gone</text>
  <rect x="200" y="306" width="65" height="26" rx="5" fill="url(#gRs)"/>
  <text x="273" y="324" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">11.8 µs</text>
  <text x="348" y="324" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#56d364">6.4×</text>

  <rect x="24" y="344" width="832" height="72" rx="10" fill="#12261a" stroke="#2ea043" stroke-opacity="0.55"/>
  <text x="440" y="376" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#56d364">first hello: 33 ms → ~70-85 µs (Go same shape: ~200-280) — jitter off + kernel keygen</text>
  <text x="440" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">9.7 KB allocated per hello vs 20.8 KB for Go (2.1×) · peak RSS ~16 MB on both sides, flat</text>

  <text x="24" y="446" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">measured 2026-10-01/02 · AMD Ryzen 9 3900X · plan ↔ UClient+BuildHandshakeState, same layer · n and 10n runs, 3 reps, medians</text>
  <text x="24" y="464" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">one-time init: jitter off at build (AWS_LC_SYS_NO_JITTER_ENTROPY=1) + kernel-entropy X25519/MLKEM768 keygen (x25519-os: libcrux) · TLS 1.2 presets: ~50 µs</text>
</svg>
